# iOS build check: compiles the app for the simulator, unsigned.
#
# Runs on pull requests that change the iOS app, and on demand (Actions → iOS build → Run
# workflow). Never on a push to main: Render deploys a main commit only once every check
# on it has passed, GitHub-hosted Macs run short at times (a job that never gets one is
# cancelled after about 15 minutes and fails), and nothing Render deploys is iOS code.
# Xcode Cloud archives the app from main, so a broken build pushed there shows up in
# Xcode Cloud. A manual run adds its check to the commit it builds; start it after Render
# has deployed that commit, or the deploy waits for it.
#
# Actions are pinned to full commit SHAs with the release in a trailing comment;
# Dependabot's github-actions updates keep them current.
name: iOS build

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# Nothing here needs more than a read-only checkout.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Xcode version is selected: the runner's default Xcode is the one whose
      # iOS Simulator platform is installed on the image. Selecting another version
      # left xcodebuild with no eligible simulator destination.

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Secrets.xcconfig
        # Placeholders: the build only has to compile, it is never signed or run.
        run: |
          cat > ios/AretaCare/Configuration/Secrets.xcconfig <<'EOF'
          DEVELOPMENT_TEAM = CI_PLACEHOLDER
          REVENUECAT_API_KEY = ci_placeholder_key
          EOF

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build
        # pipefail so a failed build fails the step rather than reporting xcpretty's
        # exit status.
        run: |
          set -o pipefail
          cd ios
          xcodebuild build \
            -scheme AretaCare \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty
