# iOS build check: compiles the app for the simulator, unsigned.
#
# Runs on every push to main or feature/iOS that changes the iOS app, on pull requests
# that change it, and on demand (Actions → iOS build → Run workflow). Commits that don't
# touch ios/ get no iOS check at all.
#
# On main this check is one Render waits for (it deploys a commit once every check on it
# has passed). A normal run takes 5–8 minutes, about as long as Xcode Cloud's archive,
# which Render already waits for. When GitHub has no Mac free, the job is cancelled after
# about 15 minutes, the check fails and Render skips that commit: re-run it with
# `gh run rerun <run-id> --failed`, or deploy by hand in Render.
#
# Actions are pinned to full commit SHAs with the release in a trailing comment;
# Dependabot's github-actions updates keep them current.
name: iOS build

on:
  push:
    branches: [main, feature/iOS]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# Nothing here needs more than a read-only checkout.
permissions:
  contents: read

# On a pull request a newer push supersedes the run in progress. Each push run gets a
# group of its own, so none is cancelled or held back: a later commit that doesn't touch
# ios/ gets no iOS check, so cancelling would leave the earlier commit unchecked (and
# Render treats a cancelled check as failed).
concurrency:
  group: ios-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build
    # A pull request from feature/iOS is already built by the push run on the same
    # commit, and its check shows on the pull request. Building it twice would only
    # compete for the same scarce Macs.
    if: github.head_ref != 'feature/iOS'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Xcode version is selected: the runner's default Xcode is the one whose
      # iOS Simulator platform is installed on the image. Selecting another version
      # left xcodebuild with no eligible simulator destination. macos-26, not macos-15:
      # the CarPlay code needs the iOS 26.4 SDK or later, and macos-15 images stop at
      # Xcode 26.3 (iOS 26.2 SDK, Nov 2026).

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Secrets.xcconfig
        # Placeholders: the build only has to compile, it is never signed or run.
        run: |
          cat > ios/AretaCare/Configuration/Secrets.xcconfig <<'EOF'
          DEVELOPMENT_TEAM = CI_PLACEHOLDER
          REVENUECAT_API_KEY = ci_placeholder_key
          EOF

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build
        # pipefail so a failed build fails the step rather than reporting xcpretty's
        # exit status.
        run: |
          set -o pipefail
          cd ios
          xcodebuild build \
            -scheme AretaCare \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty
