# CodeQL analysis of the iOS app's Swift.
#
# Runs on main every night that follows a change to the iOS app, and every Wednesday night
# regardless (CodeQL's own queries change too); on pull requests to main that change the
# iOS app; and on demand (Actions → CodeQL (Swift) → Run workflow).
#
# Not on each push to main: it needs a Mac and takes about an hour, and Render deploys a
# main commit only once every check on it has passed, so it would hold every iOS commit's
# deploy for an hour. A run's check attaches to main's latest commit, which overnight has
# long been deployed; start a manual run after Render has deployed, too.
#
# Actions are pinned to full commit SHAs (a tag can be moved; a SHA cannot). The trailing
# comment records the release, and Dependabot's github-actions updates keep both in step.
name: "CodeQL (Swift)"

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/codeql-swift.yml"
  schedule:
    - cron: "0 9 * * *" # Nightly, 09:00 UTC
  workflow_dispatch:

jobs:
  # A scheduled run goes ahead only on Wednesdays or when the iOS app changed in the last
  # day, so a quiet day doesn't take a Mac for an hour. A cheap Linux job decides.
  nightly-gate:
    name: Check for iOS changes
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      analyze: ${{ steps.check.outputs.analyze }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for iOS changes
        id: check
        # 25 hours, so a commit made just before yesterday's run isn't missed.
        run: |
          changed=$(git log --since='25 hours ago' --format=%H -- ios .github/workflows/codeql-swift.yml)
          if [ "$(date -u +%u)" = 3 ] || [ -n "$changed" ]; then
            echo "analyze=true" >> "$GITHUB_OUTPUT"
          else
            echo "analyze=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-swift:
    name: Analyze (Swift)
    needs: nightly-gate
    # The gate is skipped for every trigger except the schedule; that means analyse.
    if: ${{ !cancelled() && (needs.nightly-gate.result == 'skipped' || needs.nightly-gate.outputs.analyze == 'true') }}
    runs-on: macos-26
    # A normal run takes about an hour. Without a limit, a hung build would hold the Mac
    # for GitHub's default of six hours.
    timeout-minutes: 120
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Xcode version is selected: the runner's default Xcode is the one whose
      # iOS Simulator platform is installed on the image. Selecting another version
      # left xcodebuild with no eligible simulator destination. macos-26, not macos-15:
      # the CarPlay code needs the iOS 26.4 SDK or later, and macos-15 images stop at
      # Xcode 26.3 (iOS 26.2 SDK, Nov 2026).

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Secrets.xcconfig
        run: |
          cat > ios/AretaCare/Configuration/Secrets.xcconfig <<'EOF'
          DEVELOPMENT_TEAM = CODEQL_PLACEHOLDER
          REVENUECAT_API_KEY = codeql_placeholder_key
          EOF

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift

      - name: Build for CodeQL
        # pipefail so a failed build fails the step. Without it the pipeline reports
        # xcpretty's exit status, and CodeQL would go on to analyse an incomplete
        # database and report a clean result for code it never saw.
        run: |
          set -o pipefail
          cd ios
          xcodebuild build \
            -scheme AretaCare \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:swift"
