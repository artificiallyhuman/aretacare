# CodeQL analysis of the iOS app's Swift.
#
# Runs weekly on main, on pull requests that change the iOS app, and on demand (Actions →
# CodeQL (Swift) → Run workflow). Never on a push to main: it needs a Mac and takes about
# an hour, and Render deploys a main commit only once every check on it has passed. A
# manual run adds its check to the commit it analyses; start it after Render has deployed
# that commit, or the deploy waits for it.
#
# Actions are pinned to full commit SHAs (a tag can be moved; a SHA cannot). The trailing
# comment records the release, and Dependabot's github-actions updates keep both in step.
name: "CodeQL (Swift)"

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/codeql-swift.yml"
  schedule:
    - cron: "25 14 * * 3" # Weekly on Wednesday
  workflow_dispatch:

jobs:
  analyze-swift:
    name: Analyze (Swift)
    runs-on: macos-15
    # A normal run takes about an hour. Without a limit, a hung build would hold the Mac
    # for GitHub's default of six hours.
    timeout-minutes: 120
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Xcode version is selected: the runner's default Xcode is the one whose
      # iOS Simulator platform is installed on the image. Selecting another version
      # left xcodebuild with no eligible simulator destination.

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Secrets.xcconfig
        run: |
          cat > ios/AretaCare/Configuration/Secrets.xcconfig <<'EOF'
          DEVELOPMENT_TEAM = CODEQL_PLACEHOLDER
          REVENUECAT_API_KEY = codeql_placeholder_key
          EOF

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift

      - name: Build for CodeQL
        # pipefail so a failed build fails the step. Without it the pipeline reports
        # xcpretty's exit status, and CodeQL would go on to analyse an incomplete
        # database and report a clean result for code it never saw.
        run: |
          set -o pipefail
          cd ios
          xcodebuild build \
            -scheme AretaCare \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:swift"
