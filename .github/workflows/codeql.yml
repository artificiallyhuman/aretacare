# Actions are pinned to full commit SHAs (a tag can be moved; a SHA cannot). The trailing
# comment records the release, and Dependabot's github-actions updates keep both in step.
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "25 14 * * 3" # Weekly on Wednesday

# The Python and JavaScript analysis runs on every push and pull request. The Swift
# analysis needs a macOS runner and takes about an hour, so it runs on pull requests that
# touch the iOS app and on the weekly schedule, which scans main; never on a push to main
# (see the `changes` job).
jobs:
  changes:
    # The macOS jobs (CI's iOS build, CodeQL's Swift analysis) never run on a push to
    # main. Render deploys a main commit only once every check on it has passed (a
    # skipped check counts as passing), and neither Render service contains iOS code,
    # but a macOS job could still hold the deploy back: GitHub-hosted Macs run short at
    # times (a job that never gets one is cancelled after about 15 minutes and fails the
    # run), and the Swift analysis takes about an hour. So they run on pull requests that
    # touch ios/ or the workflows, and the weekly scan covers main. An iOS change pushed
    # straight to main gets no check here; a broken build there shows up in Xcode or
    # Xcode Cloud instead.
    # Renames are listed as a deletion plus an addition (--no-renames), so moving a file
    # into or out of ios/ counts, and git needs no file contents for the diff.
    # Same job in ci.yml; change both together.
    name: Detect iOS changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (without file contents) so the diff can reach the pull
          # request's base.
          fetch-depth: 0
          filter: blob:none

      - name: Compare with the pull request's base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            *) base="" ;;   # scheduled or manual runs build everything
          esac
          # No usable base (a scheduled or manual run, a base we cannot reach): build.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "No base to compare with; building the iOS app."
            exit 0
          fi
          changed=$(git diff --name-only --no-renames "$base" "$GITHUB_SHA")
          if printf '%s\n' "$changed" | grep -qE '^(ios/|\.github/workflows/)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "iOS app or workflow files changed; building the iOS app."
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "No iOS changes; the macOS job is skipped."
          fi

  analyze-interpreted:
    name: Analyze (Python & JavaScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  analyze-swift:
    name: Analyze (Swift)
    needs: changes
    # Never on a push to main (see the `changes` job).
    if: github.event_name != 'push' && needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Xcode version is selected: the runner's default Xcode is the one whose
      # iOS Simulator platform is installed on the image. Selecting another version
      # left xcodebuild with no eligible simulator destination.

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Secrets.xcconfig
        run: |
          cat > ios/AretaCare/Configuration/Secrets.xcconfig <<'EOF'
          DEVELOPMENT_TEAM = CODEQL_PLACEHOLDER
          REVENUECAT_API_KEY = codeql_placeholder_key
          EOF

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift

      - name: Build for CodeQL
        # pipefail so a failed build fails the step. Without it the pipeline reports
        # xcpretty's exit status, and CodeQL would go on to analyse an incomplete
        # database and report a clean result for code it never saw.
        run: |
          set -o pipefail
          cd ios
          xcodebuild build \
            -scheme AretaCare \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:swift"
