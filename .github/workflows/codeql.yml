# Actions are pinned to full commit SHAs (a tag can be moved; a SHA cannot). The trailing
# comment records the release, and Dependabot's github-actions updates keep both in step.
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "25 14 * * 3" # Weekly on Wednesday

jobs:
  analyze-interpreted:
    name: Analyze (Python & JavaScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  analyze-swift:
    name: Analyze (Swift)
    runs-on: macos-15
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Xcode version is selected: the runner's default Xcode is the one whose
      # iOS Simulator platform is installed on the image. Selecting another version
      # left xcodebuild with no eligible simulator destination.

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Secrets.xcconfig
        run: |
          cat > ios/AretaCare/Configuration/Secrets.xcconfig <<'EOF'
          DEVELOPMENT_TEAM = CODEQL_PLACEHOLDER
          REVENUECAT_API_KEY = codeql_placeholder_key
          EOF

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift

      - name: Build for CodeQL
        # pipefail so a failed build fails the step. Without it the pipeline reports
        # xcpretty's exit status, and CodeQL would go on to analyse an incomplete
        # database and report a clean result for code it never saw.
        run: |
          set -o pipefail
          cd ios
          xcodebuild build \
            -scheme AretaCare \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:swift"
