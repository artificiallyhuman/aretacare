name: AretaCare
options:
  bundleIdPrefix: com.aretacare
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.102.3"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.29.2"
  # Prebuilt libwebrtc (Talk mode's live audio connection). A third-party binary build of
  # Google's WebRTC, so it is pinned to an exact release and bumped deliberately.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: "156.0.0"

targets:
  AretaCare:
    type: application
    platform: iOS
    sources:
      - path: AretaCare
        excludes:
          - "Configuration/*.xcconfig"
          - "Configuration/*.template"
    configFiles:
      Debug: AretaCare/Configuration/Debug.xcconfig
      Release: AretaCare/Configuration/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aretacare.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: iOS_icon_glass
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      # Both entitlements files carry the CarPlay voice-based conversational entitlement
      # (com.apple.developer.carplay-voice-based-conversation), approved by Apple Nov 2026.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: AretaCare/Resources/AretaCare.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: AretaCare/Resources/AretaCare.entitlements
    info:
      path: AretaCare/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: AretaCare
        # The phone window is SwiftUI's (WindowGroup); the CarPlay screen is a template
        # scene with its own delegate. Multiple scenes stays off: no extra iPad windows.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        API_BASE_URL: $(API_BASE_URL)
        FRONTEND_URL: $(FRONTEND_URL)
        NSLocalNetworkUsageDescription: "AretaCare uses your network connection to set up the audio for Talk voice conversations. It doesn't look for, or collect data from, other devices on your network."
        NSMicrophoneUsageDescription: "AretaCare needs microphone access to record voice memos for your health journal and to have voice conversations in Talk mode."
        NSCameraUsageDescription: "AretaCare needs camera access to capture photos of medical documents."
        NSFaceIDUsageDescription: "AretaCare uses Face ID to protect your health information."
        NSPhotoLibraryUsageDescription: "AretaCare needs photo library access to upload medical document images."
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        SENTRY_DSN: $(SENTRY_DSN)
        SENTRY_ENVIRONMENT: $(SENTRY_ENVIRONMENT)
        # No export documentation needed: App Store Connect's questionnaire, answered
        # after WebRTC (Talk) added its own standard encryption, required none (Nov 2026).
        # Re-check it whenever a library that brings its own encryption is added.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
          - audio
    dependencies:
      - package: KeychainAccess
      - package: MarkdownUI
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - package: Sentry
        product: Sentry
      - package: WebRTC
        product: WebRTC
