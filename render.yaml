databases:
  # PostgreSQL Database
  - name: aretacare-db
    databaseName: aretacare
    user: aretacare
    plan: basic-1gb

services:

  # Backend API
  - type: web
    name: aretacare-backend
    env: docker
    plan: standard
    scaling:
      minInstances: 1
      maxInstances: 5
      targetMemoryPercent: 80
      targetCPUPercent: 70
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aretacare-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: S3_BUCKET_NAME
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        sync: false  # Set to your frontend domain(s), e.g., https://yourdomain.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false  # Your SMTP username, e.g., notification@yourdomain.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false  # Email address that sends notifications, e.g., notification@yourdomain.com
      - key: SMTP_FROM_NAME
        sync: false  # Sender name shown in emails, e.g., Your App Name
      - key: FRONTEND_URL
        sync: false  # Your frontend URL, e.g., https://yourdomain.com
      - key: ADMIN_EMAILS
        sync: false  # Comma-separated admin emails
      - key: CONTROL_SIGNUPS
        sync: false  # Waitlist mode - set to true to require admin invitation
      - key: AUDIT_LOG_RETENTION_DAYS
        sync: false  # Default: 90
      - key: ERROR_LOG_RETENTION_DAYS
        sync: false  # Default: 30
      - key: API_LOG_RETENTION_DAYS
        sync: false  # Default: 30
      - key: SECURITY_LOG_RETENTION_DAYS
        sync: false  # Default: 90
      - key: ADMIN_REPORT_RETENTION_DAYS
        sync: false  # Default: 30
      - key: S3_KEY_PREFIX
        value: prod/
      - key: HCAPTCHA_SECRET_KEY
        sync: false  # Optional: Get from https://www.hcaptcha.com/
      - key: FEEDBACK_EMAIL
        sync: false  # Email to receive feedback, e.g., feedback@yourdomain.com
      - key: SECURITY_ALERT_EMAIL
        sync: false  # Email for security alerts, e.g., security@yourdomain.com
      - key: SECURITY_ALERT_EVENTS
        sync: false  # Default: account_lockout,blocked_file_upload,email_changed,unauthorized_access
      - key: WEBAUTHN_RP_ID
        sync: false  # Your domain for passkeys, e.g., yourdomain.com
      - key: WEBAUTHN_ORIGIN
        sync: false  # Your frontend origin for passkeys, e.g., https://yourdomain.com
      - key: PUSH_NOTIFICATIONS_ENABLED
        value: "FALSE"  # Set to TRUE to enable iOS push notifications (requires APNs key)
      - key: APNS_KEY_ID
        sync: false  # 10-char Key ID from Apple Developer > Keys
      - key: APNS_TEAM_ID
        sync: false  # Your Apple Team ID
      - key: APNS_TOPIC
        value: com.aretacare.ios
      - key: APNS_USE_SANDBOX
        value: "FALSE"  # TRUE for TestFlight/debug, FALSE for App Store builds
      - key: APNS_KEY_PATH
        sync: false  # Path to .p8 key file on server (e.g., /etc/secrets/AuthKey.p8)

  # Frontend
  - type: web
    name: aretacare-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # Serve the prerendered HTML for each public route. These must come
      # before the wildcard fallback so they win the match. Without them,
      # `/about` gets rewritten to `/index.html` (the Landing prerender)
      # instead of `/about/index.html` (the About prerender).
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /waitlist
        destination: /waitlist/index.html
      - type: rewrite
        source: /login
        destination: /login/index.html
      - type: rewrite
        source: /register
        destination: /register/index.html
      - type: rewrite
        source: /tools/jargon
        destination: /tools/jargon/index.html
      - type: rewrite
        source: /tools/coach
        destination: /tools/coach/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      # SPA fallback for auth-gated routes (/settings, /journal, etc.) and
      # unknown paths — they get the root index.html and React Router takes over.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Your backend URL, e.g., https://your-backend.onrender.com/api
      - key: VITE_HCAPTCHA_SITE_KEY
        sync: false  # Optional: Get from https://www.hcaptcha.com/
