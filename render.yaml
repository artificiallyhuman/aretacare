databases:
  # PostgreSQL Database
  - name: aretacare-db
    databaseName: aretacare
    user: aretacare
    plan: free

services:

  # Backend API
  - type: web
    name: aretacare-backend
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aretacare-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: S3_BUCKET_NAME
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        sync: false  # Set to your frontend domain(s), e.g., https://yourdomain.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false  # Your SMTP username, e.g., noreply@yourdomain.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false  # Email address that sends notifications, e.g., noreply@yourdomain.com
      - key: SMTP_FROM_NAME
        sync: false  # Sender name shown in emails, e.g., Your App Name
      - key: FRONTEND_URL
        sync: false  # Your frontend URL, e.g., https://yourdomain.com
      - key: ADMIN_EMAILS
        sync: false  # Comma-separated admin emails
      - key: AUDIT_LOG_RETENTION_DAYS
        value: 90
      - key: ERROR_LOG_RETENTION_DAYS
        value: 30
      - key: SESSION_TIMEOUT_MINUTES
        value: 60
      - key: S3_KEY_PREFIX
        value: prod/
      - key: HCAPTCHA_SECRET_KEY
        sync: false  # Optional: Get from https://www.hcaptcha.com/
      - key: FEEDBACK_EMAIL
        sync: false  # Email to receive feedback, e.g., feedback@yourdomain.com

  # Frontend
  - type: web
    name: aretacare-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Your backend URL, e.g., https://your-backend.onrender.com/api
      - key: VITE_HCAPTCHA_SITE_KEY
        sync: false  # Optional: Get from https://www.hcaptcha.com/
